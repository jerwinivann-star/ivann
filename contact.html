<style>
.contact-form { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.contact-form label { font-weight: 500; margin-top: 8px; }
.contact-form input, .contact-form textarea {
  width: 100%; padding: 10px; box-sizing: border-box;
  background: rgba(0,0,0,0.35); color: #fff;
  border: 1px solid #22d3ee; border-radius: 10px;
  font-family: 'Roboto', sans-serif; font-size: 1rem;
}
.contact-form input:focus, .contact-form textarea:focus {
  outline: none; box-shadow: 0 0 10px #22d3ee;
}
.contact-form button { margin-top: 16px; cursor: pointer; }
</style>
</head>

<main>
<section class="card">
<h2>Contact Me</h2>
<p class="lead">Have a question or want to say hi? Send me a message below!</p>
<form class="contact-form" action="mailto:youremail@example.com" method="post" enctype="text/plain">
<label for="name">Name</label>
<input type="text" id="name" name="name" required>
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" required></textarea>
<div class="center"><button type="submit" class="btn">Send</button></div>
</form>
</section>
</main>
